name: Convert DBML to SVG

on:
  push:
    paths:
      # Triggers only when dbml files in this specific folder change
      - '**/docs/.dbml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Create the destination directory if it doesn't exist
      - name: Create output directory
        run: mkdir -p docs/diagrams

      # Explicitly point to your input file and output folder
      - name: Render DBML to SVG
        run: |
          npx @softwaretechnik/dbml-renderer -i docs/.dbml -o docs/diagrams/schema.svg
        
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update database SVG diagram'
          file_pattern: '**/docs/diagrams/*.svg' # Limits commits to your specific output folder
